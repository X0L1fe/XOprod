<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Прямоугольник</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            perspective: 1000px;
        }

        .rectangle {
            width: 300px; /* Ширина прямоугольника */
            height: 150px; /* Высота прямоугольника */
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(25deg) rotateY(25deg);
            animation: rotate 5s infinite linear;
        }

        .face {
            position: absolute;
            background: rgba(0, 123, 255, 0.8);
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .front, .back {
            width: 300px;
            height: 150px;
        }
        .left {
            background-image: url("1.png")
        }

        .right, .left {
            width: 100px; /* Глубина прямоугольника */
            height: 150px;
        }

        .top, .bottom {
            width: 300px;
            height: 100px; /* Глубина прямоугольника */
        }

        .front  { transform: translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(250px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        
    </style>
</head>
<body>
    <div class="rectangle">
        <div class="face front">Front</div>
        <div class="face back">Back</div>
        <div class="face right">Right</div>
        <div class="face left">Left</div>
        <div class="face top">Top</div>
        <div class="face bottom">Bottom</div>
    </div>
</body>
</html>
